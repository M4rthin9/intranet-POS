name: ccida-pos
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ccida_owner
      POSTGRES_DB: ccida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/001-app-role.sql:/docker-entrypoint-initdb.d/001-app-role.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ccida_owner -d ccida']
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build: { context: ., target: tools }
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set owner migration URL}
    command: [npm, run, db:migrate]
    depends_on:
      db: { condition: service_healthy }
  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set app DATABASE_URL}
      APP_ORIGIN: ${APP_ORIGIN:-https://pos.ccida.local}
      COOKIE_SECURE: 'true'
      SESSION_HOURS: '8'
      BACKUP_DIRECTORY: /backups
    volumes: ['backups:/backups']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  backup-worker:
    build: { context: ., target: tools }
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set app DATABASE_URL}
      BACKUP_DIRECTORY: /backups
    volumes: ['backups:/backups']
    depends_on:
      migrate: { condition: service_completed_successfully }
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
volumes:
  postgres-data:
  backups:
  caddy-data:
  caddy-config:
