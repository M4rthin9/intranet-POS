name: CCIDA validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    container: node:24-trixie
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ccida_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: ccida_test
        options: >-
          --health-cmd "pg_isready -U ccida_test -d ccida_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ccida_test:isolated-ci-only@postgres:5432/ccida_test?schema=public
      TEST_DATABASE_URL: postgresql://ccida_test:isolated-ci-only@postgres:5432/ccida_test?schema=public
      APP_ORIGIN: http://localhost:3000
      BACKUP_DIRECTORY: /tmp/ccida-backups
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y postgresql-client-17
      - run: npm ci
      - run: npm run format:check
      - run: npm run db:migrate
      - run: npm run validate:phase -- 8
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx tsx scripts/http-lan-smoke.ts
      - run: npx tsx scripts/performance.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: docs/validation
  production-container:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # These credentials exist only in this job's fresh, private Docker network.
      COMPOSE_PROJECT_NAME: ccida-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: isolated-compose-owner-only
      APP_DATABASE_PASSWORD: isolated-compose-app-only
      DATABASE_URL: postgresql://ccida_app:isolated-compose-app-only@db:5432/ccida?schema=public
      MIGRATION_DATABASE_URL: postgresql://ccida_owner:isolated-compose-owner-only@db:5432/ccida?schema=public
      APP_ORIGIN: https://pos.ccida.local
      BOOTSTRAP_USERNAME: ci-smoke-superadmin
      BOOTSTRAP_PASSWORD: isolated-compose-bootstrap-only
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the production application and backup worker
        run: |
          docker compose config --quiet
          docker compose up --build -d db app backup-worker
      - name: Check production health with the restricted application database role
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Bootstrap a fresh administrator and verify production authorization
        run: |
          docker compose run --rm -e BOOTSTRAP_USERNAME -e BOOTSTRAP_PASSWORD migrate npm run bootstrap
          docker compose exec -T -e BOOTSTRAP_USERNAME -e BOOTSTRAP_PASSWORD app node -e "(async()=>{const base='http://127.0.0.1:3000';const r=await fetch(base+'/api/auth',{method:'POST',headers:{Origin:process.env.APP_ORIGIN,'Content-Type':'application/json'},body:JSON.stringify({username:process.env.BOOTSTRAP_USERNAME,password:process.env.BOOTSTRAP_PASSWORD})});if(!r.ok)throw Error('Production login failed: '+r.status);const user=(await r.json()).user;if(user.roleName!=='SUPER_ADMIN')throw Error('Incorrect bootstrap role');const cookie=r.headers.get('set-cookie');if(!cookie||!cookie.includes('HttpOnly')||!cookie.includes('Secure'))throw Error('Protected cookie missing');const settings=await fetch(base+'/api/data?view=settings',{headers:{Cookie:cookie.split(';')[0]}});if(!settings.ok)throw Error('Production settings authorization failed: '+settings.status);console.log('PASS production image, bootstrap, restricted database role and authenticated settings');})().catch(e=>{console.error(e.message);process.exit(1)})"
      - name: Reapply migrations without resetting the database
        run: docker compose run --rm migrate
      - name: Production container logs
        if: always()
        run: docker compose logs --no-color
      - name: Remove only this job's isolated containers and volumes
        if: always()
        run: docker compose down --volumes
